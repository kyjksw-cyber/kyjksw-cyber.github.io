<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>404 시리즈 회수 — 1·2·3·4편</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --ink-2: #444444;
    --ink-3: #999999;
    --line: #e5e5e5;
    --accent: #d63838;
    --node: #111111;
    --font: 'Pretendard', ui-sans-serif, -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    padding: 60px 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .frame { width: 100%; max-width: 1200px; }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    margin-bottom: 56px;
    text-align: center;
  }
  .spine {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    padding: 0 40px;
  }
  .rail {
    position: absolute;
    top: 24px;
    left: 12.5%;
    right: 12.5%;
    height: 2px;
    background: var(--line);
    z-index: 0;
  }
  .rail-progress {
    position: absolute;
    top: 24px;
    left: 12.5%;
    width: calc(75% * 0.667);
    height: 2px;
    background: var(--ink);
    z-index: 1;
  }
  .node {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 12px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--node);
    margin: 18px auto 0;
  }
  .node--final .dot {
    background: var(--accent);
    box-shadow: 0 0 0 8px rgba(214, 56, 56, 0.18);
  }
  .num {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--ink-3);
    font-weight: 700;
    margin-top: 28px;
  }
  .node--final .num { color: var(--accent); }
  .title {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 12px;
    line-height: 1.3;
  }
  .sub {
    font-size: 14px;
    color: var(--ink-2);
    margin-top: 8px;
    line-height: 1.5;
  }
  .node--final .title {
    visibility: hidden;
    height: 0;
    margin: 0;
  }
  .question {
    display: inline-block;
    margin-top: 14px;
    font-size: 64px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .next {
    margin-top: 14px;
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .footer {
    margin-top: 72px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">404 SERIES — 4 EPISODES</div>
    <div class="spine">
      <div class="rail"></div>
      <div class="rail-progress"></div>

      <div class="node">
        <div class="dot"></div>
        <div class="num">EP 01</div>
        <div class="title">나 자신 알기</div>
        <div class="sub">개인의 맥락</div>
      </div>
      <div class="node">
        <div class="dot"></div>
        <div class="num">EP 02</div>
        <div class="title">내 업무 알기</div>
        <div class="sub">업무의 맥락</div>
      </div>
      <div class="node">
        <div class="dot"></div>
        <div class="num">EP 03</div>
        <div class="title">팀을 알아가기</div>
        <div class="sub">팀의 맥락</div>
      </div>
      <div class="node node--final">
        <div class="dot"></div>
        <div class="num">EP 04</div>
        <div class="title">우리 사업부</div>
        <div class="question">?</div>
        <div class="next">그 다음은?</div>
      </div>
    </div>
    <div class="footer">404 ERROR · 2026</div>
  </div>
</body>
</html>
