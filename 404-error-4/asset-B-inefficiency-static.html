<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>비효율 — 콘텐츠 중복 / 피드백 구조 없음 / 결과 가시적이지 못함</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --ink-2: #444444;
    --ink-3: #999999;
    --line: #e5e5e5;
    --accent: #d63838;
    --font: 'Pretendard', ui-sans-serif, -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    padding: 80px 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .frame { width: 100%; max-width: 1200px; text-align: center; }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    margin-bottom: 60px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 56px;
    align-items: start;
  }
  .col { display: flex; flex-direction: column; align-items: center; }
  .icon {
    width: 110px; height: 110px; margin-bottom: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
  }
  .icon svg {
    width: 100%; height: 100%;
    stroke: currentColor; fill: none;
    stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .icon-doubled .doc-front, .icon-doubled .doc-back { fill: var(--bg); }
  .icon-doubled .lines { stroke-width: 1.2; }
  .label {
    font-size: 32px; font-weight: 800;
    color: var(--ink); letter-spacing: -0.02em;
    margin-bottom: 14px; line-height: 1.25;
  }
  .desc {
    font-size: 14px; color: var(--ink-2);
    line-height: 1.6; max-width: 220px;
  }
  .footer {
    margin-top: 72px; text-align: center;
    font-size: 12px; color: var(--ink-3);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">사업부의 비효율</div>
    <div class="grid">
      <div class="col">
        <div class="icon icon-doubled">
          <svg viewBox="0 0 100 100">
            <rect class="doc-back" x="22" y="18" width="48" height="60" rx="3" />
            <line class="lines" x1="30" y1="32" x2="62" y2="32" />
            <line class="lines" x1="30" y1="42" x2="62" y2="42" />
            <line class="lines" x1="30" y1="52" x2="54" y2="52" />
            <rect class="doc-front" x="34" y="28" width="48" height="60" rx="3" />
            <line class="lines" x1="42" y1="42" x2="74" y2="42" />
            <line class="lines" x1="42" y1="52" x2="74" y2="52" />
            <line class="lines" x1="42" y1="62" x2="66" y2="62" />
          </svg>
        </div>
        <div class="label">콘텐츠 중복</div>
        <div class="desc">같은 결과물을<br/>각자 따로 만들고 있다</div>
      </div>

      <div class="col">
        <div class="icon">
          <svg viewBox="0 0 100 100">
            <circle cx="22" cy="50" r="9" />
            <circle cx="78" cy="50" r="9" />
            <line x1="34" y1="50" x2="62" y2="50" />
            <polyline points="58,46 64,50 58,54" />
            <line x1="62" y1="62" x2="56" y2="62" stroke-dasharray="3 4" />
            <line x1="48" y1="62" x2="42" y2="62" stroke-dasharray="3 4" />
            <line x1="34" y1="62" x2="32" y2="62" stroke-dasharray="3 4" />
            <line x1="46" y1="76" x2="54" y2="84" stroke="#d63838" stroke-width="2" />
            <line x1="54" y1="76" x2="46" y2="84" stroke="#d63838" stroke-width="2" />
          </svg>
        </div>
        <div class="label">고립</div>
        <div class="desc">내 PC에서만 굴러가는 결과물,<br/>옆자리 동료에게 닿지 못한다</div>
      </div>

      <div class="col">
        <div class="icon">
          <svg viewBox="0 0 100 100">
            <line x1="20" y1="80" x2="84" y2="80" />
            <line x1="20" y1="80" x2="20" y2="20" />
            <rect x="30" y="55" width="10" height="25" stroke-dasharray="3 3" />
            <rect x="46" y="48" width="10" height="32" stroke-dasharray="3 3" />
            <rect x="62" y="38" width="10" height="42" stroke-dasharray="3 3" />
            <text x="50" y="34" text-anchor="middle"
                  font-family="Pretendard, sans-serif"
                  font-size="22" font-weight="700"
                  fill="#d63838" stroke="none">?</text>
          </svg>
        </div>
        <div class="label">성과 안 보임</div>
        <div class="desc">비용 절감·생산성 향상이<br/>숫자로 측정되지 않는다</div>
      </div>
    </div>
    <div class="footer">404 ERROR (4) — 사업부의 비효율</div>
  </div>
</body>
</html>
